# velo5x0-bsp: VeloCloud Edge 5x0 board and switch modules
PACKAGE_NAME="vc-edge5x0"
PACKAGE_VERSION="0.4.0"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="vc-edge5x0-board"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="vc-edge5x0-switch"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
# Built and qualified for Debian 13 kernels of the 6.12 series only (VBSP-REQ-5).
BUILD_EXCLUSIVE_KERNEL="^6\.12\."

# velo5x0-bsp: igb with the VeloCloud Edge 5x0 glue (VBSP-DES-1B).
# Sources: Debian linux-source-6.12 6.12.118-1, drivers/net/ethernet/intel/igb,
# byte-identical (see PROVENANCE.md); patches applied by dkms at build time.
PACKAGE_NAME="igb-vc"
PACKAGE_VERSION="0.4.0"
PATCH[0]="200-igb-velocloud-edge5x0.patch"
PATCH[1]="201-velo5x0-bsp-ext-mdio-bus-name.patch"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/net/ethernet/intel/igb modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/net/ethernet/intel/igb clean"
BUILT_MODULE_NAME[0]="igb"
BUILT_MODULE_LOCATION[0]="drivers/net/ethernet/intel/igb/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^6\.12\."

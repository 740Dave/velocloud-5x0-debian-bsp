# velo5x0-bsp: VeloCloud Edge 5x0 switches as DSA, lan1..lan8 (VBSP-DES-1C).
# Built only for a kernel that has the mv88e6xxx DSA driver, i.e. the
# velo5x0-bsp kernel (+velo5x0dsa, see kernel-build/); on a stock Debian
# kernel DKMS skips it (BUILD_EXCLUSIVE_CONFIG) and the switches stay
# unmanaged (vc-edge5x0-switch).
PACKAGE_NAME="vc-edge5x0-dsa"
PACKAGE_VERSION="0.4.0"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="vc-edge5x0-dsa"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^6\.12\."
BUILD_EXCLUSIVE_CONFIG="CONFIG_NET_DSA_MV88E6XXX"

# velo5x0-bsp: the I2C character device for the fan service and the CPU
# temperature sensor.  The board module is not listed: it loads before igb
# through the softdep in modprobe.d (and from velo5x0-fan-failsafe.service on
# an EDGE540), so other hosts never log a failed load of it.
i2c-dev
coretemp

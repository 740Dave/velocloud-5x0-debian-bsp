# velo5x0-bsp fan control (velo5x0-fand).  Temperatures are the hottest
# coretemp reading in degrees C.  The thresholds are the spec's proposed
# defaults (VBSP-REQ-10), proposed and not yet validated on every fan.
[fan]
# at or below: fan off (duty 0)
off_c = 50
# from off, at or above: fan starts (kick, then at least stall_free_duty)
on_c = 60
# at or above: full duty (255)
full_c = 80
# lowest duty used while running.  Measured on a 540 (stock fan, 2026-11-24):
# turning at duty 12 (~3250 rpm), stopped at 8; 24 keeps a 2x margin.
# Recalibrate with `velo5x0-fan sweep` for another fan.
stall_free_duty = 24
kick_duty = 255
kick_s = 2
poll_s = 2
stall_polls = 3

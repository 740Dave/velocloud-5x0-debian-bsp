# velo5x0-bsp fan control (velo5x0-fand).  Temperatures are the hottest
# coretemp reading in degrees C.  The thresholds are the spec's proposed
# defaults (VBSP-REQ-10), proposed and not yet validated on every fan.
[fan]
# at or below: fan off (duty 0)
off_c = 50
# from off, at or above: fan starts (kick, then at least stall_free_duty)
on_c = 60
# at or above: full duty (255)
full_c = 80
# lowest duty used while running.  Measured on a 540 (stock fan, 2026-11-24):
# turning at duty 12 (~3250 rpm), stopped at 8; 24 keeps a 2x margin.
# Recalibrate with `velo5x0-fan sweep` for another fan.
stall_free_duty = 24
kick_duty = 255
kick_s = 2
poll_s = 2
stall_polls = 3

# Drive temperature input (VBSP-REQ-14).  The fan duty is
# max(CPU demand, drive demand).  Temperatures are the hottest drive that
# reports one (kernel drivetemp); with none, nothing here has any effect.
# drive_min_duty must stay above stall_free_duty.
# at or below: no drive demand, and the "drive demand on" memory is cleared
drive_off_c = 55
# at or above: drive demand on, duty drive_min_duty; it then stays on (at
# least drive_min_duty) until the drive is at or below drive_off_c
drive_on_c = 60
# from here the duty rises linearly from drive_min_duty ...
drive_ramp_c = 65
# ... to full duty at this temperature and above
drive_full_c = 70
# 69 of 255 = 27 %: measured on one 540 on 2026-11-24, no stall at about 3700 rpm
drive_min_duty = 69
# Minimum run time (0.5.1): each time drive demand starts the fan, it holds at
# least drive_min_duty for this many seconds before the drive may release it,
# even if the drive cools to drive_off_c sooner.  CPU demand, the CPU
# fail-safes and the stall latch are not affected.  0 turns this off.
drive_min_run_s = 600

# velo5x0-bsp (VBSP-REQ-6): the board buses must exist and the switch and WAN
# PHY resets be released before igb binds; the switches are set up after igb
# has exported their MDIO buses: on a stock Debian kernel by
# vc-edge5x0-switch (unmanaged), on the velo5x0-bsp +velo5x0dsa kernel by
# vc-edge5x0-dsa (mv88e6xxx, lan1..lan8; vc-edge5x0-switch then does
# nothing).  A soft dependency that does not exist for the running kernel
# (vc-edge5x0-dsa on a stock kernel) or fails (any board that is not a
# VeloCloud Edge 5x0 2.x) does not stop igb loading.
softdep igb pre: vc-edge5x0-board post: vc-edge5x0-switch vc-edge5x0-dsa
